<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Grouping anagrams by sorted key</title>
  <desc id="desc">Words eat, tea, and ate normalize to the same sorted key aet, while tan and nat normalize to ant.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <rect x="40" y="40" width="880" height="440" rx="18" fill="#f7f6f2" stroke="#d9dedb" stroke-width="3"/>
  <text x="70" y="95" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#1f2933">Group Anagrams with a Normalized Key</text>
  <text x="70" y="135" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5d6875">Sort each word. Anagrams produce the same key and land in the same bucket.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">
    <rect x="90" y="190" width="120" height="58" rx="10" fill="#ffffff" stroke="#d9dedb" stroke-width="3"/>
    <text x="150" y="228" fill="#1f2933">eat</text>
    <rect x="90" y="270" width="120" height="58" rx="10" fill="#ffffff" stroke="#d9dedb" stroke-width="3"/>
    <text x="150" y="308" fill="#1f2933">tea</text>
    <rect x="90" y="350" width="120" height="58" rx="10" fill="#ffffff" stroke="#d9dedb" stroke-width="3"/>
    <text x="150" y="388" fill="#1f2933">ate</text>
    <rect x="260" y="230" width="120" height="58" rx="10" fill="#e6f3ef" stroke="#0f766e" stroke-width="3"/>
    <text x="320" y="268" fill="#0f766e">aet</text>
    <rect x="260" y="330" width="120" height="58" rx="10" fill="#e6f3ef" stroke="#0f766e" stroke-width="3"/>
    <text x="320" y="368" fill="#0f766e">aet</text>
    <rect x="520" y="210" width="320" height="210" rx="14" fill="#ffffff" stroke="#d9dedb" stroke-width="3"/>
    <text x="680" y="255" fill="#c2412d">key: aet</text>
    <rect x="565" y="292" width="75" height="48" rx="8" fill="#e6f3ef" stroke="#0f766e" stroke-width="2"/>
    <text x="602" y="324" fill="#0f766e" font-size="18">eat</text>
    <rect x="652" y="292" width="75" height="48" rx="8" fill="#e6f3ef" stroke="#0f766e" stroke-width="2"/>
    <text x="690" y="324" fill="#0f766e" font-size="18">tea</text>
    <rect x="739" y="292" width="75" height="48" rx="8" fill="#e6f3ef" stroke="#0f766e" stroke-width="2"/>
    <text x="777" y="324" fill="#0f766e" font-size="18">ate</text>
    <text x="680" y="382" fill="#5d6875" font-size="18">same sorted key -> same group</text>
  </g>
  <g stroke="#5d6875" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 210 219 C 230 219, 238 250, 260 259"/>
    <path d="M 210 299 C 230 299, 238 278, 260 259"/>
    <path d="M 210 379 C 230 379, 238 360, 260 359"/>
    <path d="M 380 259 C 440 255, 470 255, 520 285"/>
    <path d="M 380 359 C 440 360, 470 350, 520 325"/>
  </g>
</svg>
